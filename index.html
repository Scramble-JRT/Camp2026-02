<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>移動君</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#222;--sub:#667;--line:#d8dee6;--acc:#2563eb;--route:#e11d48}
*{box-sizing:border-box}
body{margin:0;font-family:"Meiryo","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--acc);color:#fff;padding:14px 24px;font-size:22px;font-weight:bold}
header small{font-weight:normal;font-size:13px;margin-left:12px;opacity:.85}
main{display:grid;grid-template-columns:250px 1fr 300px;gap:16px;padding:16px;max-width:1500px;margin:auto}
@media(max-width:1100px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
h2{margin:0 0 10px;font-size:16px;color:var(--sub)}
.cmd{display:block;width:100%;text-align:left;padding:12px;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:17px}
.cmd.active{border-color:var(--acc);background:#eaf1ff;font-weight:bold}
select{font-size:16px;padding:8px;width:100%;border:1px solid var(--line);border-radius:6px}
.seg{display:flex;margin-bottom:10px}
.seg button{flex:1;padding:9px;font-size:15px;border:1px solid var(--acc);background:#fff;color:var(--acc);cursor:pointer}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0;border-left:0}
.seg button.on{background:var(--acc);color:#fff}
.hidden{display:none}
.cmd:disabled{opacity:.5;cursor:not-allowed}
.bar{display:flex;align-items:center;gap:6px;font-size:13px;margin:3px 0}
.bar span{width:100px}.bar div{flex:1;height:10px;background:#e5e7eb;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
.arrive{background:#dcfce7;border-left:4px solid #16a34a;padding:10px 12px;border-radius:4px;margin-bottom:12px;font-weight:bold;color:#166534}
.moving{background:#fef9c3;border-left:4px solid #ca8a04;padding:10px 12px;border-radius:4px;margin-bottom:12px;font-weight:bold}
.mode{display:block;margin:6px 0;font-size:15px;cursor:pointer}
.hint{color:var(--sub);font-size:13px;line-height:1.6}
.dest{background:#fff1f2;border-left:4px solid var(--route);padding:10px 12px;border-radius:4px;line-height:1.7;margin-bottom:12px}
.dest b{font-size:18px}
.summary{font-size:15px;line-height:1.8;margin-bottom:10px}
.rooms span{display:inline-block;background:#eaf1ff;border-radius:12px;padding:2px 10px;margin:2px 0}
.steps{counter-reset:s;padding:0;list-style:none;margin:0}
.steps li{counter-increment:s;position:relative;padding:6px 8px 6px 38px;margin-bottom:6px;background:#f8fafc;border-left:4px solid var(--route);border-radius:4px}
.steps li::before{content:counter(s);position:absolute;left:8px;top:6px;background:var(--route);color:#fff;width:22px;height:22px;border-radius:50%;text-align:center;font-size:13px;line-height:22px}
#map{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.legend{font-size:13px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin:0 4px 0 12px}
</style>
</head>
<body>
<header>移動君<small>試作版：指示された動作から、所定位置までの経路を作成（ロボは動かしません）</small></header>
<main>
  <section class="card">
    <h2>命令の指定方法</h2>
    <div class="seg"><button id="m-btn" class="on">ボタン選択</button><button id="m-voice">音声入力</button></div>
    <div id="voice" class="hidden">
      <button class="cmd" id="micToggle" style="text-align:center">🎤 聞き取り開始</button>
      <div id="vstat" class="hint">マイクの使用を許可してください。</div>
      <div id="bars"></div>
      <p class="hint">認識できる言葉：「服たたんで」「丸付けして」「鉛筆取って」「消しゴム取って」。</p>
    </div>
    <h2 style="margin-top:18px">① 動作の命令</h2>
    <div id="cmds"></div>
    <h2 style="margin-top:18px">② 現在の位置</h2>
    <select id="pos"></select>
    <h2 style="margin-top:18px">③ マップをクリックしたとき</h2>
    <label class="mode"><input type="radio" name="mode" value="robot" checked> 現在位置を変更</label>
    <label class="mode"><input type="radio" name="mode" value="target"> 選択中の命令の所定位置を変更</label>
    <p class="hint" id="modeHint">床をクリックすると、ロボの現在位置が変わります。</p>
    <button class="cmd" id="reset" style="font-size:14px;padding:8px;text-align:center">所定位置を初期値に戻す</button>
  </section>

  <section class="card">
    <h2>家の間取り</h2>
    <svg id="map"></svg>
    <div class="legend"><i style="background:#2563eb"></i>現在位置<i style="background:#e11d48"></i>目標（物の場所）<i style="background:#f59e0b"></i>ロボの立ち位置</div>
  </section>

  <section class="card">
    <h2>④ 経路</h2>
    <div id="out" class="hint">動作の命令を選んでください。</div>
    <div id="goalBox" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
    <h2>ゴールの判定方法</h2>
    <div class="seg"><button id="g-sim" class="on">シミュレーション</button><button id="g-cam">カメラ</button></div>
    <div id="camPanel" class="hidden">
      <button class="cmd" id="gcamBtn" style="text-align:center">📷 カメラを起動</button>
      <select id="gcamSel" class="hidden" style="margin-bottom:8px"></select>
      <video id="gcam" class="hidden" autoplay playsinline muted style="width:100%;border-radius:6px;border:1px solid var(--line)"></video>
      <button class="cmd hidden" id="gpick" style="text-align:center;margin-top:8px;background:var(--acc);color:#fff">選択（今の画像でゴール判定）</button>
      <div id="gstat" class="hint"></div>
      <div id="gbars"></div>
      <p class="hint">「服・鉛筆・消しゴム・宿題」を写し、選んだ命令のものと一致すればゴールです。</p>
    </div>
    </div>
  </section>
</main>
<section id="markWrap" class="card hidden" style="max-width:1468px;margin:0 auto 24px">
  <h2>丸付け君（移動完了で自動起動）<button id="markClose" class="cmd" style="display:inline-block;width:auto;margin:0 0 0 12px;padding:4px 12px;font-size:13px">閉じる</button></h2>
  <iframe id="markFrame" title="丸付け君" allow="camera" style="width:100%;height:780px;border:1px solid var(--line);border-radius:8px"></iframe>
</section>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script>
// ===== 間取りデータ（1マス＝約0.5m） =====
const W=24, H=16, CELL=30, M_PER_CELL=0.5;
const ROOMS=[
 {name:"子供部屋",x:1,y:1,w:7,h:5,color:"#fef3c7"},
 {name:"寝室",x:9,y:1,w:7,h:5,color:"#e0e7ff"},
 {name:"洗面所",x:17,y:1,w:6,h:5,color:"#cffafe"},
 {name:"廊下",x:1,y:7,w:22,h:2,color:"#f1f5f9"},
 {name:"玄関",x:1,y:10,w:5,h:5,color:"#e7e5e4"},
 {name:"リビング",x:7,y:10,w:9,h:5,color:"#dcfce7"},
 {name:"キッチン",x:17,y:10,w:6,h:5,color:"#fce7f3"}
];
// ドア（壁に開いた通路）
const DOORS=[[4,6],[12,6],[19,6],[3,9],[11,9],[19,9],[6,12],[16,12]];
// 家具（通れない）
const FURN=[
 {name:"本棚",x:1,y:1,w:1,h:3},{name:"学習机",x:5,y:1,w:3,h:1},
 {name:"ベッド",x:10,y:1,w:3,h:3},{name:"洗濯機",x:18,y:1,w:2,h:1},
 {name:"靴箱",x:1,y:10,w:1,h:3},{name:"テーブル",x:9,y:11,w:4,h:2},
 {name:"ソファ",x:13,y:14,w:2,h:1},{name:"調理台",x:17,y:10,w:5,h:1}
];
// 物の置き場所：item=物の場所(家具セル) / stand=ロボが立つマス
const COMMANDS=[
 {id:"fold",label:"服たたみ",icon:"👕",object:"洗濯物",room:"寝室",furn:"ベッド",item:[11,2],stand:[11,4]},
 {id:"homework",label:"宿題丸付け",icon:"📝",object:"宿題のノート",room:"リビング",furn:"テーブル",item:[10,11],stand:[10,13]},
 {id:"pencil",label:"鉛筆をとる",icon:"✏️",object:"鉛筆（筆立て）",room:"子供部屋",furn:"学習机",item:[6,1],stand:[6,2]},
 {id:"eraser",label:"消しゴムをとる",icon:"🧽",object:"消しゴム（本棚の引き出し）",room:"子供部屋",furn:"本棚",item:[1,2],stand:[2,2]}
];
// 現在位置の候補
const SPOTS=[
 {label:"玄関",pos:[3,12]},{label:"廊下（中央）",pos:[11,7]},{label:"リビング",pos:[8,14]},
 {label:"キッチン",pos:[19,12]},{label:"洗面所",pos:[20,3]},{label:"子供部屋",pos:[3,5]},{label:"寝室",pos:[14,4]}
];

// ===== グリッド生成 =====
const grid=[], roomAt=[];
for(let y=0;y<H;y++){grid.push(Array(W).fill(1));roomAt.push(Array(W).fill(null));}
ROOMS.forEach(r=>{for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++){grid[y][x]=0;roomAt[y][x]=r.name;}});
DOORS.forEach(([x,y])=>grid[y][x]=0);
FURN.forEach(f=>{for(let y=f.y;y<f.y+f.h;y++)for(let x=f.x;x<f.x+f.w;x++)grid[y][x]=2;});
const free=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&grid[y][x]===0;

// ===== 経路探索（幅優先探索：4方向、最短） =====
function findPath(s,g){
  const key=(x,y)=>y*W+x, prev=new Map([[key(...s),null]]), q=[s];
  while(q.length){
    const [x,y]=q.shift();
    if(x===g[0]&&y===g[1]){
      const path=[]; let k=key(x,y);
      while(k!==null){path.push([k%W,Math.floor(k/W)]);k=prev.get(k);}
      return path.reverse();
    }
    for(const [dx,dy] of [[0,-1],[1,0],[0,1],[-1,0]]){
      const nx=x+dx,ny=y+dy;
      if(free(nx,ny)&&!prev.has(key(nx,ny))){prev.set(key(nx,ny),key(x,y));q.push([nx,ny]);}
    }
  }
  return null;
}
const DIRS={"0,-1":"上（奥）","1,0":"右","0,1":"下（手前）","-1,0":"左"};
const ARROW={"0,-1":"↑","1,0":"→","0,1":"↓","-1,0":"←"};
function toSteps(path){
  const steps=[];
  for(let i=1;i<path.length;i++){
    const d=(path[i][0]-path[i-1][0])+","+(path[i][1]-path[i-1][1]);
    const last=steps[steps.length-1];
    if(last&&last.d===d)last.n++; else steps.push({d,n:1});
  }
  return steps;
}

// ===== 状態 =====
const $=id=>document.getElementById(id);
const state={cmd:null,pos:SPOTS[0].pos.slice(),mode:"robot",goalMode:"sim",goal:null};
const DEFAULTS=JSON.parse(JSON.stringify(COMMANDS.map(c=>({id:c.id,item:c.item,stand:c.stand}))));
const furnAt=(x,y)=>{const f=FURN.find(f=>x>=f.x&&x<f.x+f.w&&y>=f.y&&y<f.y+f.h);return f?f.name:"床の上";};
const STORE="idou-targets";
function saveTargets(){try{localStorage.setItem(STORE,JSON.stringify(COMMANDS.map(c=>({id:c.id,item:c.item,stand:c.stand}))));}catch(e){}}
function loadTargets(){try{
  (JSON.parse(localStorage.getItem(STORE))||[]).forEach(t=>{const c=COMMANDS.find(c=>c.id===t.id);
    if(c&&free(...t.stand)){c.item=t.item;c.stand=t.stand;}});
}catch(e){}}
loadTargets();
// 所定位置の変更：家具をクリック→その家具が物の場所、隣の床がロボの立ち位置。床をクリック→そこ自体
function setTarget(c,x,y){
  if(free(x,y)){c.item=[x,y];c.stand=[x,y];return true;}
  if(grid[y][x]!==2)return false;
  let best=null;
  for(const [dx,dy] of [[0,1],[0,-1],[1,0],[-1,0]]){
    const nx=x+dx,ny=y+dy;
    if(!free(nx,ny))continue;
    const p=findPath(state.pos,[nx,ny]);
    if(p&&(!best||p.length<best.len))best={len:p.length,s:[nx,ny]};
  }
  if(!best)return false;
  c.item=[x,y];c.stand=best.s;return true;
}

// ===== 描画 =====
function drawMap(path){
  const c=COMMANDS.find(c=>c.id===state.cmd);
  let s=`viewBox="0 0 ${W*CELL} ${H*CELL}"`, b="";
  b+=`<rect width="${W*CELL}" height="${H*CELL}" fill="#475569"/>`;
  ROOMS.forEach(r=>b+=`<rect x="${r.x*CELL}" y="${r.y*CELL}" width="${r.w*CELL}" height="${r.h*CELL}" fill="${r.color}"/>`);
  DOORS.forEach(([x,y])=>b+=`<rect x="${x*CELL}" y="${y*CELL}" width="${CELL}" height="${CELL}" fill="#fff"/>`);
  // 格子線
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x]===0)
    b+=`<rect x="${x*CELL}" y="${y*CELL}" width="${CELL}" height="${CELL}" fill="none" stroke="#0000000f"/>`;
  FURN.forEach(f=>{
    b+=`<rect x="${f.x*CELL+2}" y="${f.y*CELL+2}" width="${f.w*CELL-4}" height="${f.h*CELL-4}" rx="4" fill="#cbd5e1" stroke="#94a3b8"/>`;
    const vertical=f.h>f.w*1.5&&f.w===1;
    b+=`<text x="${(f.x+f.w/2)*CELL}" y="${(f.y+f.h/2)*CELL}" font-size="11" fill="#334155" text-anchor="middle" dominant-baseline="middle"${vertical?` transform="rotate(-90 ${(f.x+f.w/2)*CELL} ${(f.y+f.h/2)*CELL})"`:""}>${f.name}</text>`;
  });
  // 部屋名
  ROOMS.forEach(r=>{
    const lx=(r.x+0.3)*CELL, ly=(r.y+r.h-0.45)*CELL;
    if(r.name==="廊下")b+=`<text x="${(r.x+r.w/2)*CELL}" y="${(r.y+1)*CELL}" font-size="13" fill="#64748b" text-anchor="middle" dominant-baseline="middle">廊下</text>`;
    else b+=`<text x="${(r.x+r.w-0.3)*CELL}" y="${ly}" font-size="13" font-weight="bold" fill="#475569" text-anchor="end">${r.name}</text>`;
  });
  // 経路
  if(path){
    b+=`<polyline points="${path.map(([x,y])=>`${(x+.5)*CELL},${(y+.5)*CELL}`).join(" ")}" fill="none" stroke="#e11d48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 9"/>`;
    b+=`<polyline points="${path.map(([x,y])=>`${(x+.5)*CELL},${(y+.5)*CELL}`).join(" ")}" fill="none" stroke="#e11d48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>`;
  }
  if(c){
    b+=`<circle cx="${(c.item[0]+.5)*CELL}" cy="${(c.item[1]+.5)*CELL}" r="11" fill="#e11d48" stroke="#fff" stroke-width="2"/>`;
    b+=`<text x="${(c.item[0]+.5)*CELL}" y="${(c.item[1]+.5)*CELL+1}" font-size="13" text-anchor="middle" dominant-baseline="middle">${c.icon}</text>`;
    b+=`<rect x="${c.stand[0]*CELL+7}" y="${c.stand[1]*CELL+7}" width="${CELL-14}" height="${CELL-14}" rx="3" fill="#f59e0b" stroke="#fff" stroke-width="2"/>`;
  }
  b+=`<circle cx="${(state.pos[0]+.5)*CELL}" cy="${(state.pos[1]+.5)*CELL}" r="12" fill="#2563eb" stroke="#fff" stroke-width="3"/>`;
  b+=`<text x="${(state.pos[0]+.5)*CELL}" y="${(state.pos[1]+.5)*CELL+1}" font-size="14" text-anchor="middle" dominant-baseline="middle">🤖</text>`;
  const m=$("map"); m.setAttribute("viewBox",`0 0 ${W*CELL} ${H*CELL}`); m.innerHTML=b;
}

// ===== 移動シミュレーション =====
const SIM_MS=250;
let sim=null;
function stopSim(){if(sim){clearInterval(sim.timer);sim=null;}}
function startSim(){
  const c=COMMANDS.find(c=>c.id===state.cmd); if(!c)return;
  stopSim();
  const path=findPath(state.pos,c.stand); if(!path)return;
  let i=0;
  const finish=()=>{
    stopSim(); state.pos=c.stand.slice(); update();
    if(c.id==="homework"&&state.goalMode==="sim")openMarker();
  };
  if(path.length===1){finish();return;}
  sim={timer:setInterval(()=>{
    i++; state.pos=path[i].slice(); drawMap(path);
    $("out").querySelector(".moving")&&($("out").querySelector(".moving b").textContent=`${i}/${path.length-1}マス`);
    if(i>=path.length-1)finish();
  },SIM_MS)};
  update(true,path);
}
let markOpened=false, markVisible=false;
function openMarker(){
  markOpened=true; markVisible=true;
  $("markWrap").classList.remove("hidden");
  $("markFrame").src="marutsuke.html";
  $("markWrap").scrollIntoView({behavior:"smooth"});
}
function closeMarker(){
  markVisible=false;
  $("markWrap").classList.add("hidden");$("markFrame").src="about:blank";
}
$("markClose").onclick=()=>{closeMarker();markOpened=false;};
// 丸付け君は「宿題丸付け」の間だけ表示：他の命令で消し、再選択で再表示
function syncMarker(){
  if(state.cmd!=="homework"){if(markVisible)closeMarker();}
  else if(markOpened&&!markVisible)openMarker();
}

function update(simulating,simPath){
  if(!simulating)stopSim();
  syncMarker();
  const c=COMMANDS.find(c=>c.id===state.cmd);
  document.querySelectorAll(".cmd").forEach(el=>el.classList.toggle("active",el.dataset.id===state.cmd));
  if(!c){drawMap(null);return;}
  const path=simulating?simPath:findPath(state.pos,c.stand);
  drawMap(path);
  const atStand=!simulating&&state.pos[0]===c.stand[0]&&state.pos[1]===c.stand[1];
  const g=state.goal;
  const camOk=!!g&&g.cmd===c.id&&g.pos===state.pos.join()&&g.stand===c.stand.join();
  // シミュレーション判定：立ち位置に着けばゴール／カメラ判定：カメラで目標物を確認できたらゴール
  const arrived=!simulating&&(state.goalMode==="cam"?camOk:atStand);
  const here=roomAt[state.pos[1]][state.pos[0]];
  let html=`<div class="dest">命令：<b>${c.icon} ${c.label}</b><br>
    ${c.object} は <b>${roomAt[c.stand[1]][c.stand[0]]||"ドア付近"}</b> の「${furnAt(...c.item)}」にあります。</div>`;
  if(!path){$("out").className="";$("out").innerHTML=html+"<p>経路が見つかりません。</p>";return;}
  if(arrived)html+=`<div class="arrive">✅ 移動完了：目標位置に到着しました（${c.label}の位置）${state.goalMode==="cam"?"<br>カメラでゴールを確認しました":""}</div>`;
  else if(atStand&&state.goalMode==="cam")html+=`<div class="moving">📷 目標付近に着きました。カメラで目標物を写して「選択」を押すとゴール判定します。</div>`;
  if(arrived&&c.id==="homework")html+=`<button class="cmd" id="openMark" style="text-align:center">📝 丸付け君を開く</button>`;
  if(simulating)html+=`<div class="moving">🚶 移動中… <b>0/${path.length-1}マス</b></div>`;
  const steps=toSteps(path), n=path.length-1;
  const seq=[]; path.forEach(([x,y])=>{const r=roomAt[y][x]; if(r&&seq[seq.length-1]!==r)seq.push(r);});
  html+=`<div class="summary">現在位置：<b>${here||"ドア付近"}</b><br>
    距離：<b>${n}マス</b>（約${(n*M_PER_CELL).toFixed(1)}m）／曲がる回数：${Math.max(steps.length-1,0)}回<br>
    通る部屋：<span class="rooms">${seq.join("</span> → <span>")}</span></div>`;
  if(n===0)html+=`<p>すでに目標位置にいます。</p>`;
  else html+=`<ol class="steps">${steps.map(s=>`<li>${ARROW[s.d]} ${DIRS[s.d]}へ <b>${s.n}</b>マス進む</li>`).join("")}</ol>`;
  if(!simulating&&!atStand)html+=`<button class="cmd" id="simBtn" style="text-align:center;margin-top:12px;background:var(--acc);color:#fff">▶ 移動をシミュレーション</button>`;
  html+=`<p class="hint" style="margin-top:10px">到着後、${c.object}を対象にアームの動作へ移ります（アーム操作は人が行います）。</p>`;
  $("out").className=""; $("out").innerHTML=html;
  if($("simBtn"))$("simBtn").onclick=startSim;
  if($("openMark"))$("openMark").onclick=openMarker;
}

// ===== 初期化・操作 =====
COMMANDS.forEach(c=>{
  const b=document.createElement("button");
  b.className="cmd"; b.dataset.id=c.id; b.textContent=c.icon+"  "+c.label;
  b.onclick=()=>{state.cmd=c.id;update();};
  $("cmds").appendChild(b);
});
SPOTS.forEach((s,i)=>{const o=document.createElement("option");o.value=i;o.textContent=s.label;$("pos").appendChild(o);});
$("pos").onchange=e=>{state.pos=SPOTS[e.target.value].pos.slice();update();};
$("map").addEventListener("click",e=>{
  const r=$("map").getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/r.width*W), y=Math.floor((e.clientY-r.top)/r.height*H);
  if(state.mode==="target"){
    const c=COMMANDS.find(c=>c.id===state.cmd);
    if(c&&setTarget(c,x,y)){saveTargets();update();}
    return;
  }
  if(free(x,y)){
    state.pos=[x,y];
    const i=SPOTS.findIndex(s=>s.pos[0]===x&&s.pos[1]===y);
    $("pos").selectedIndex=i; // 候補外なら未選択
    update();
  }
});
document.querySelectorAll("input[name=mode]").forEach(r=>r.onchange=()=>{
  state.mode=r.value;
  $("modeHint").textContent=r.value==="robot"
    ?"床をクリックすると、ロボの現在位置が変わります。"
    :"先に命令を選び、マップ上の家具（物の場所）か床をクリックしてください。家具の場合は隣の床がロボの立ち位置になります。";
});
$("reset").onclick=()=>{
  DEFAULTS.forEach(d=>{const c=COMMANDS.find(c=>c.id===d.id);c.item=d.item.slice();c.stand=d.stand.slice();});
  saveTargets();update();
};
// ===== 音声入力（Teachable Machine 音声モデル） =====
const MODEL_URL="https://teachablemachine.withgoogle.com/models/btBjcXK_K/";
const VOICE_MAP={"服たたんで":"fold","丸付けして":"homework","鉛筆取って":"pencil","消しゴム取って":"eraser"};
const THRESHOLD=0.85;
let recognizer=null, listening=false, lastHit={id:null,t:0};

function setInputMode(voice){
  $("m-btn").classList.toggle("on",!voice); $("m-voice").classList.toggle("on",voice);
  $("voice").classList.toggle("hidden",!voice);
  document.querySelectorAll("#cmds .cmd").forEach(b=>b.disabled=voice&&Object.values(VOICE_MAP).includes(b.dataset.id));
  if(!voice&&listening)stopListen();
}
async function startListen(){
  const st=$("vstat");
  if(typeof speechCommands==="undefined"){st.textContent="音声認識ライブラリを読み込めません（ネット接続を確認）。";return;}
  try{
    if(!recognizer){
      st.textContent="モデルを読み込み中…";
      recognizer=speechCommands.create("BROWSER_FFT",undefined,MODEL_URL+"model.json",MODEL_URL+"metadata.json");
      await recognizer.ensureModelLoaded();
      const labels=recognizer.wordLabels();
      $("bars").innerHTML=labels.map((l,i)=>`<div class="bar"><span>${l}</span><div><i id="bar${i}"></i></div></div>`).join("");
    }
    const labels=recognizer.wordLabels();
    await recognizer.listen(res=>{
      const sc=res.scores;
      labels.forEach((l,i)=>{const b=$("bar"+i);if(b)b.style.width=Math.round(sc[i]*100)+"%";});
      let k=0; sc.forEach((s,i)=>{if(s>sc[k])k=i;});
      const id=VOICE_MAP[labels[k]], now=Date.now();
      if(id&&sc[k]>=THRESHOLD&&!(lastHit.id===id&&now-lastHit.t<2000)){
        lastHit={id,t:now}; state.cmd=id; update();
        $("vstat").textContent="認識：「"+labels[k]+"」（"+Math.round(sc[k]*100)+"%）";
      }
    },{probabilityThreshold:0,overlapFactor:0.5,invokeCallbackOnNoiseAndUnknown:true});
    listening=true; $("micToggle").textContent="⏹ 聞き取り停止";
    st.textContent="聞き取り中… 命令を話してください。";
  }catch(e){
    st.textContent="マイクを開始できません："+(e.message||e)+"（ブラウザのマイク許可を確認。file:// で開いた場合は https:// のURLか 起動.bat から開いてください）";
  }
}
function stopListen(){
  if(recognizer&&listening)recognizer.stopListening();
  listening=false; $("micToggle").textContent="🎤 聞き取り開始"; $("vstat").textContent="停止中";
}
$("m-btn").onclick=()=>setInputMode(false);
$("m-voice").onclick=()=>setInputMode(true);
$("micToggle").onclick=()=>listening?stopListen():startListen();

// ===== ゴール判定（カメラ：Teachable Machine 画像モデル） =====
const GOAL_MODEL="https://teachablemachine.withgoogle.com/models/jSvvQuH7_/";
const GOAL_MAP={"服":"fold","鉛筆":"pencil","消しゴム":"eraser","宿題":"homework"}; // 「つくえ」「人」は使わない
const GOAL_TH=0.8;
let goalModel=null, gStream=null;

function setGoalMode(cam){
  state.goalMode=cam?"cam":"sim";
  $("g-sim").classList.toggle("on",!cam); $("g-cam").classList.toggle("on",cam);
  $("camPanel").classList.toggle("hidden",!cam);
  if(!cam)stopGoalCam();
  update();
}
function stopGoalCam(){
  if(gStream){gStream.getTracks().forEach(t=>t.stop());gStream=null;}
  $("gcam").srcObject=null;
  ["gcam","gcamSel","gpick"].forEach(i=>$(i).classList.add("hidden"));
  $("gcamBtn").classList.remove("hidden"); $("gstat").textContent="";
}
async function startGoalCam(deviceId){
  if(gStream)gStream.getTracks().forEach(t=>t.stop());
  gStream=await navigator.mediaDevices.getUserMedia({video:deviceId?{deviceId:{exact:deviceId}}:true});
  $("gcam").srcObject=gStream;
}
$("g-sim").onclick=()=>setGoalMode(false);
$("g-cam").onclick=()=>setGoalMode(true);
$("gcamBtn").onclick=async()=>{
  const st=$("gstat");
  if(!navigator.mediaDevices||!window.isSecureContext){
    st.innerHTML="このページはカメラを使えない開き方です（"+location.protocol+"）。https:// のURL（GitHub Pages）か、ローカルでは <b>起動.bat</b> から開いてください。";return;
  }
  try{
    st.textContent="カメラを準備中…（許可を求められたら「許可」）";
    await startGoalCam();
    const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="videoinput");
    const cur=gStream.getVideoTracks()[0].getSettings().deviceId;
    $("gcamSel").innerHTML=devs.map((d,i)=>`<option value="${d.deviceId}" ${d.deviceId===cur?"selected":""}>${d.label||("カメラ"+(i+1))}</option>`).join("");
    ["gcam","gcamSel","gpick"].forEach(i=>$(i).classList.remove("hidden")); $("gcamBtn").classList.add("hidden");
    st.textContent="モデルを読み込み中…";
    if(typeof tmImage==="undefined")throw new Error("判定ライブラリを読み込めません（ネット接続を確認）");
    if(!goalModel)goalModel=await tmImage.load(GOAL_MODEL+"model.json",GOAL_MODEL+"metadata.json");
    st.textContent="目標物を写して「選択」を押してください。";
  }catch(e){
    st.textContent="カメラを開始できません："+(e.name||"")+" "+(e.message||e)+"（ブラウザのカメラ許可を確認）";
  }
};
$("gcamSel").onchange=async e=>{try{await startGoalCam(e.target.value);}catch(err){$("gstat").textContent="切替失敗："+err.message;}};
$("gpick").onclick=async()=>{
  const st=$("gstat"), v=$("gcam"), c=COMMANDS.find(c=>c.id===state.cmd);
  if(!c){st.textContent="先に動作の命令を選んでください。";return;}
  if(!goalModel||!v.videoWidth){st.textContent="カメラ・モデルの準備ができていません。";return;}
  const cv=document.createElement("canvas"); cv.width=v.videoWidth; cv.height=v.videoHeight;
  cv.getContext("2d").drawImage(v,0,0);               // 押した瞬間のフレーム
  const pred=await goalModel.predict(cv);
  $("gbars").innerHTML=pred.map(p=>`<div class="bar"><span>${p.className}</span><div><i style="width:${Math.round(p.probability*100)}%"></i></div></div>`).join("");
  const used=pred.filter(p=>GOAL_MAP[p.className]);   // つくえ・人は除外
  const top=used.slice().sort((a,b)=>b.probability-a.probability)[0];
  const best=pred.slice().sort((a,b)=>b.probability-a.probability)[0];
  if(best===top&&top.probability>=GOAL_TH&&GOAL_MAP[top.className]===c.id){
    state.goal={cmd:c.id,pos:state.pos.join(),stand:c.stand.join()};
    st.textContent=`判定：${top.className}（${Math.round(top.probability*100)}%）→ ゴール！`;
    update();
    if(c.id==="homework")openMarker();
  }else{
    st.textContent=`判定：${best.className}（${Math.round(best.probability*100)}%）→ 「${c.label}」のゴールではありません。`;
  }
};

update();
</script>
