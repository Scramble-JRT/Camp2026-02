<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>丸付け君</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#222;--sub:#667;--ok:#d62828;--ng:#1d4ed8;--line:#d8dee6;--acc:#2563eb}
*{box-sizing:border-box}
body{margin:0;font-family:"Meiryo","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--acc);color:#fff;padding:14px 24px;font-size:22px;font-weight:bold}
header small{font-weight:normal;font-size:13px;margin-left:12px;opacity:.85}
main{display:grid;grid-template-columns:260px 1fr 1fr;gap:16px;padding:16px;max-width:1400px;margin:auto}
@media(max-width:1000px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
h2{margin:0 0 10px;font-size:16px;color:var(--sub)}
.qlist button{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:6px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:15px}
.qlist button.active{border-color:var(--acc);background:#eaf1ff;font-weight:bold}
.qlist .mark{float:right;font-weight:bold}
.qtext{font-size:17px;line-height:1.8;margin:0 0 14px;white-space:pre-wrap}
label{display:block;margin:8px 0 4px;font-size:14px;color:var(--sub)}
input[type=text]{font-size:18px;padding:8px 10px;width:140px;border:1px solid var(--line);border-radius:6px}
.row{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 20px;font-size:16px;cursor:pointer;margin-top:12px}
.btn.sub{background:#fff;color:var(--acc);border:1px solid var(--acc);margin-left:8px}
.result{display:flex;gap:18px;align-items:center;margin:4px 0 12px}
.big{font-size:72px;line-height:1;font-weight:bold}
.big.ok{color:var(--ok)}.big.ng{color:var(--ng)}
.detail{font-size:15px;line-height:1.6}
.steps{counter-reset:s;padding:0;list-style:none;margin:0}
.steps li{counter-increment:s;position:relative;padding:8px 8px 8px 40px;margin-bottom:8px;background:#f8fafc;border-left:4px solid var(--acc);border-radius:4px;line-height:1.7}
.steps li::before{content:counter(s);position:absolute;left:10px;top:8px;background:var(--acc);color:#fff;width:22px;height:22px;border-radius:50%;text-align:center;font-size:13px;line-height:22px}
.ans{margin-top:10px;padding:10px;background:#fff7e6;border-radius:6px}
.hint{color:var(--sub);font-size:14px}
#preview{max-width:100%;border:1px solid var(--line);border-radius:6px;margin-top:8px}
.hidden{display:none}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.seg button{flex:1 1 45%;padding:8px 4px;font-size:14px;border:1px solid var(--acc);background:#fff;color:var(--acc);border-radius:6px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.seg button.fill{background:#fff7e6;border-color:#d97706;color:#b45309;font-weight:bold}
.fig{width:100%;max-width:380px;display:block;margin:0 0 12px;background:#fff;border:1px solid var(--line);border-radius:8px}
.fig .ln{stroke:#333;stroke-width:2;fill:none}
.fig .ln.dash{stroke-dasharray:5 4;stroke-width:1.6;stroke:#c2410c}
.fig .ln.thin{stroke-width:1.5}
.fig .arc{stroke:#2563eb;fill:none;stroke-width:1.6}
.fig .arc.ex{stroke:#c2410c}
.fig .tx{font-size:12px;fill:#2563eb;font-weight:bold}
.fig .tx.ex{fill:#c2410c}
.fig .tx.vx{fill:#222;font-weight:normal;font-size:14px}
.fig .tx.lb{fill:#555;font-style:italic;font-weight:normal;font-size:14px}
.figcap{font-size:13px;color:var(--sub);margin:-6px 0 12px}
</style>
</head>
<body>
<header>丸付け君<small>試作版：第5回 実力テスト（図形と角度）</small></header>
<main>
  <section class="card">
    <h2>問題を選ぶ</h2>
    <div class="qlist" id="qlist"></div>
    <h2 style="margin-top:18px">回答用紙の読み取り</h2>
    <div class="seg" id="patSeg">
      <button data-p="パターンA">パターンA</button><button data-p="パターンB">パターンB</button><button data-p="パターンC">パターンC</button><button id="fillBtn" class="fill">回答欄へ記入</button>
    </div>
    <div id="patStat" class="hint" style="margin-bottom:10px">パターンを選んで「回答欄へ記入」を押すと、そのパターンの回答が入ります。</div>
    <button class="btn" id="camBtn" style="margin-top:0">📷 カメラを起動</button>
    <select id="camSel" class="hidden" style="margin-top:8px;width:100%;padding:6px"></select>
    <video id="cam" class="hidden" autoplay playsinline muted style="width:100%;margin-top:8px;border-radius:6px;border:1px solid var(--line)"></video>
    <button class="btn hidden" id="pickBtn">選択（今の画像を判定）</button>
    <div id="camStat" class="hint" style="margin-top:6px"></div>
    <img id="preview" class="hidden" alt="判定された回答用紙">
    <p class="hint">「選択」を押した瞬間の画像をAIが判定し、パターンA・B・Cのどれかなら、その回答を各問題に入力します（白紙は無視）。</p>
  </section>

  <section class="card">
    <h2>問題と自分の回答</h2>
    <p class="qtext" id="qtext"></p>
    <div id="fig"></div>
    <div id="inputs"></div>
    <button class="btn" id="check">丸付けする</button>
    <button class="btn sub" id="showExp">解説だけ見る</button>
  </section>

  <section class="card">
    <h2>結果と解説</h2>
    <div id="result" class="hint">回答を入力して「丸付けする」を押してください。</div>
    <div id="exp"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script>
// ===== 図形描画ヘルパー（SVG） =====
const D2R = Math.PI/180;
const P = (x,y)=>({x,y});
const r1 = n=>Math.round(n*10)/10;
const svg = (w,h,body)=>`<svg class="fig" viewBox="0 0 ${w} ${h}" role="img">${body}</svg>`;
const ln = (a,b,c="")=>`<line class="ln ${c}" x1="${r1(a.x)}" y1="${r1(a.y)}" x2="${r1(b.x)}" y2="${r1(b.y)}"/>`;
const tx = (p,t,c="")=>`<text class="tx ${c}" x="${r1(p.x)}" y="${r1(p.y)}" text-anchor="middle" dominant-baseline="middle">${t}</text>`;
const vx = (p,name,dx,dy)=>tx(P(p.x+dx,p.y+dy),name,"vx");
// 頂点Oで半直線OAとOBがつくる角に弧とラベルを描く
function ang(O,A,B,label,r=22,c="",lr=r+12){
  const a1 = Math.atan2(A.y-O.y,A.x-O.x)/D2R, a2 = Math.atan2(B.y-O.y,B.x-O.x)/D2R;
  const d = ((a2-a1+540)%360)-180;
  const pt = (a,rad)=>P(O.x+rad*Math.cos(a*D2R),O.y+rad*Math.sin(a*D2R));
  const s = pt(a1,r), e = pt(a1+d,r), m = pt(a1+d/2,lr);
  return `<path class="arc ${c}" d="M${r1(s.x)} ${r1(s.y)} A${r} ${r} 0 0 ${d>0?1:0} ${r1(e.x)} ${r1(e.y)}"/>`+tx(m,label,c);
}
// 等しい辺の印
function tick(a,b){
  const m=P((a.x+b.x)/2,(a.y+b.y)/2), L=Math.hypot(b.x-a.x,b.y-a.y), nx=-(b.y-a.y)/L*5, ny=(b.x-a.x)/L*5;
  return ln(P(m.x-nx,m.y-ny),P(m.x+nx,m.y+ny),"thin");
}

// 問題ごとの図。ex=true で解説用（求めた角度を書き込む）
const FIGS = {
 "1-1": ex=>{
   const Ap=P(190,20), Ll=P(173.9,80), Rl=P(218,80), Lm=P(149.8,170), Rm=P(260,170);
   return svg(300,190,
     ln(P(20,80),P(280,80))+ln(P(20,170),P(280,170))+ln(Ap,Lm)+ln(Ap,Rm)+
     tx(P(290,80),"ℓ","lb")+tx(P(290,170),"m","lb")+
     ang(Ap,Lm,Rm,"40°",24)+
     ang(Lm,Ap,P(250,170),"75°",26)+
     (ex?ang(Ll,Ap,Rl,"75°",20,"ex")+"":"")+
     ang(Rl,Ap,Ll,ex?"65°":"a",20,ex?"ex":"",ex?36:30));
 },
 "1-2": ex=>{
   const A=P(190,40),B=P(124.2,63.9),C=P(112,132.8),D=P(165.6,177.8),E=P(231.4,153.9),F=P(243.6,85);
   let b = ln(P(20,40),P(285,40))+ln(P(20,177.8),P(285,177.8))+
     ln(A,B)+ln(B,C)+ln(C,D)+ln(D,E)+ln(E,F)+ln(F,A)+
     tx(P(293,40),"ℓ","lb")+tx(P(293,178),"m","lb")+
     vx(A,"A",8,-9)+vx(B,"B",-10,-3)+vx(C,"C",-10,5)+vx(D,"D",0,13)+vx(E,"E",11,6)+vx(F,"F",11,0)+
     ang(A,P(100,40),B,"20°",34)+
     ang(D,P(100,177.8),C,ex?"40°":"x",26,ex?"ex":"",ex?40:38);
   if(ex){
     const G=P(265,40);
     b += ln(A,D,"dash")+ln(A,G,"dash")+vx(G,"G",0,-10)+
       ang(A,B,D,"60°",22,"ex",40)+ang(A,D,G,"100°",30,"ex",44)+ang(D,C,A,"60°",20,"ex",32);
   }
   return svg(310,205,b);
 },
 "1-3": ex=>{
   const L=P(20,150),R=P(280,150),T=P(20,80),U=P(230,74),W=P(154,150),Pp=P(130.3,109.8),Q=P(180.6,123.4);
   return svg(300,170,
     ln(L,R)+ln(L,U)+ln(T,R)+ln(U,W)+
     ang(L,R,U,"20°",36)+ang(R,L,T,"15°",36)+ang(U,Pp,W,"25°",26,"",14+26)+
     ang(Pp,U,R,ex?"35°":"x",18,ex?"ex":"",ex?40:32)+
     ang(Q,U,R,ex?"60°":"y",14,ex?"ex":"",ex?34:28));
 },
 "2-1": ex=>{
   const A=P(192,54),B=P(30,190),C=P(270,190),D=P(150,89.3);
   let b = ln(A,B)+ln(B,C)+ln(C,A)+ln(D,C)+tick(D,B)+tick(D,C)+tick(A,C)+
     vx(A,"A",0,-11)+vx(B,"B",-10,5)+vx(C,"C",10,5)+vx(D,"D",-12,-4)+
     ang(B,C,A,"40°",36)+
     ang(C,A,D,ex?"20°":"x",62,ex?"ex":"",ex?72:70);
   if(ex) b += ang(C,B,D,"40°",34,"ex",48)+ang(D,A,C,"80°",18,"ex",34)+ang(A,D,C,"80°",24,"ex",40);
   return svg(300,210,b);
 },
 "2-2": ex=>{
   const A=P(80,30),D=P(240,30),B=P(29.3,138.8),C=P(189.3,138.8),E=P(152,218);
   let b = ln(A,B)+ln(B,C)+ln(C,D)+ln(D,A)+ln(D,E)+ln(A,E)+
     vx(A,"A",-4,-10)+vx(D,"D",8,-9)+vx(B,"B",-10,6)+vx(C,"C",12,-3)+vx(E,"E",0,12)+
     ang(E,A,D,"46°",32,"",42);
   if(ex) b += ang(A,B,E,"46°",44,"ex",56)+ang(A,B,D,"115°",18,"ex",30)+ang(D,A,C,"65°",28,"ex",44);
   else b += ang(D,A,C,"?",28,"",40);
   return svg(300,240,b);
 },
 "2-3": ex=>{
   const A=P(120,15),B=P(14,121),C=P(150,184),D=P(256,78),E=P(183,151);
   let b = ln(A,B)+ln(B,C)+ln(C,D)+ln(D,A)+ln(A,E)+ln(B,E)+tick(A,D)+tick(A,E)+
     vx(A,"A",0,-10)+vx(B,"B",-11,2)+vx(C,"C",-4,12)+vx(D,"D",11,0)+vx(E,"E",12,7)+
     ang(A,D,E,"40°",30,"",42)+
     ang(B,A,E,ex?"55°":"?",34,ex?"ex":"",ex?48:46);
   if(ex) b += ang(E,A,D,"70°",24,"ex",38)+ang(D,A,C,"70°",22,"ex",38)+ang(A,B,D,"110°",13,"ex",24)+ang(A,B,E,"70°",58,"ex",72);
   return svg(300,205,b);
 }
};

// 問題データ（画像から書き起こし）。answers: 各欄の正解
const QUESTIONS = [
 {id:"1-1", title:"1 (1)", text:"右の図で、2直線ℓ, mは平行である。このとき、∠aの大きさを求めよ。",
  fields:[{label:"∠a",unit:"°",ans:"65"}],
  steps:["ℓ∥m より、同位角は等しいので、三角形の3つの内角は ∠a、40°、75° になる。",
         "三角形の内角の和は180°。",
         "∠a ＝ 180° − 40° − 75° ＝ 65°"]},
 {id:"1-2", title:"1 (2)", text:"正六角形ABCDEFの頂点A, Dが平行な2直線ℓ, m上にあるとき、∠xの大きさを求めよ。",
  fields:[{label:"∠x",unit:"°",ans:"40"}],
  steps:["正六角形の1つの内角は120°。対角線ADで半分に分かれるので ∠BAD ＝ ∠FAD ＝ ∠CDA ＝ 60°。",
         "直線ℓ上で点Aの右側に点Gをとると、∠GAD ＝ 180° − 20° − 60° ＝ 100°。",
         "ℓ∥m より錯角は等しいので ∠x ＋ ∠CDA ＝ ∠GAD。",
         "∠x ＝ 100° − 60° ＝ 40°"]},
 {id:"1-3", title:"1 (3)", text:"右の図において、∠x, ∠yの大きさを求めよ。",
  fields:[{label:"∠x",unit:"°",ans:"35"},{label:"∠y",unit:"°",ans:"60"}],
  steps:["∠x は、三角形の外角の性質（外角＝となり合わない2つの内角の和）を使う。",
         "∠x ＝ 20° ＋ 15° ＝ 35°",
         "∠y も同じ性質を続けて使う。",
         "∠y ＝ 20° ＋ 25° ＋ 15° ＝ 60°"]},
 {id:"2-1", title:"2 (1)", text:"右の図で、∠ABC＝40°、DB＝DC＝AC である。このとき、∠xの大きさは何度か求めよ。",
  fields:[{label:"∠x",unit:"°",ans:"20"}],
  steps:["DB＝DC より △DBC は二等辺三角形。∠DCB ＝ ∠DBC ＝ 40°。",
         "∠ADC は △DBC の外角なので ∠ADC ＝ 40° ＋ 40° ＝ 80°。",
         "DC＝AC より △ACD も二等辺三角形。∠A ＝ ∠ADC ＝ 80°。",
         "∠x ＝ 180° − 80° × 2 ＝ 20°"]},
 {id:"2-2", title:"2 (2)", text:"平行四辺形ABCDがある。辺DCの延長上に点Eを∠AED＝46°となるようにとったら、∠BAE＝2/5 ∠BAD となった。このとき、∠ADCの大きさを求めよ。",
  fields:[{label:"∠ADC",unit:"°",ans:"65"}],
  steps:["AB∥DE より錯角は等しいので ∠BAE ＝ ∠AED ＝ 46°。",
         "(2/5)∠BAD ＝ ∠BAE ＝ 46° より、∠BAD ＝ 46° × 5/2 ＝ 115°。",
         "平行四辺形の隣り合う角の和は180°。",
         "∠ADC ＝ 180° − ∠BAD ＝ 180° − 115° ＝ 65°"]},
 {id:"2-3", title:"2 (3)", text:"右の図で、四角形ABCDはひし形、Eは辺DC上の点で、AD＝AE である。∠DAE＝40°のとき、∠ABEの大きさは何度か。",
  fields:[{label:"∠ABE",unit:"°",ans:"55"}],
  steps:["AD＝AE より △ADE は二等辺三角形。∠D ＝ ∠AED。",
         "∠AED ＝ (180° − 40°) ÷ 2 ＝ 140° ÷ 2 ＝ 70°。よって ∠D ＝ 70°。",
         "ひし形の隣り合う角の和は180°なので ∠BAD ＝ 180° − 70° ＝ 110°。",
         "ひし形の辺は等しいので AB＝AD＝AE。△ABE は二等辺三角形。∠BAE ＝ 110° − 40° ＝ 70°。",
         "∠ABE ＝ (180° − 70°) ÷ 2 ＝ 55°"]}
];
// ※ 2(3) の解説は画像で途中までのため、続きは解き方に沿って補完（答えは 55°）

const state = {cur:0, marks:{}, answers:{}};
// 回答用紙パターンごとの回答（画像から書き起こし）
const PATTERN_ANS = {
 "パターンA":{"1-1":["65"],"1-2":["42"],"1-3":["35","50"],"2-1":["20"],"2-2":["65"],"2-3":["54"]},
 "パターンB":{"1-1":["64"],"1-2":["20"],"1-3":["35","60"],"2-1":["25"],"2-2":["45"],"2-3":["93"]},
 "パターンC":{"1-1":["65"],"1-2":["40"],"1-3":["35","60"],"2-1":["20"],"2-2":["65"],"2-3":["55"]}
};
const $ = id => document.getElementById(id);

// 全角→半角、単位・空白除去して比較
function norm(s){
  return s.replace(/[０-９．－]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
          .replace(/[°度\s]/g,"");
}

function renderList(){
  $("qlist").innerHTML = "";
  QUESTIONS.forEach((q,i)=>{
    const b = document.createElement("button");
    const m = state.marks[q.id];
    b.className = i===state.cur ? "active" : "";
    b.innerHTML = q.title + (m ? `<span class="mark" style="color:${m==="○"?"var(--ok)":"var(--ng)"}">${m}</span>` : "");
    b.onclick = ()=>{state.cur=i; renderQuestion();};
    $("qlist").appendChild(b);
  });
}

function renderQuestion(){
  const q = QUESTIONS[state.cur];
  $("qtext").textContent = q.text;
  $("fig").innerHTML = FIGS[q.id] ? FIGS[q.id](false) : "";
  $("inputs").innerHTML = q.fields.map((f,i)=>
    `<div class="row"><label style="margin:0;width:60px">${f.label}＝</label><input type="text" id="in${i}" autocomplete="off"> ${f.unit}</div>`).join("");
  const saved = state.answers[q.id] || [];
  q.fields.forEach((f,i)=>{
    const el = $("in"+i);
    el.value = saved[i] || "";
    el.oninput = ()=>{ (state.answers[q.id] = state.answers[q.id] || [])[i] = el.value; };
  });
  $("result").className = "hint";
  $("result").textContent = "回答を入力して「丸付けする」を押してください。";
  $("exp").innerHTML = "";
  renderList();
}

function explanation(q){
  const fig = FIGS[q.id] ? FIGS[q.id](true)+`<p class="figcap">図：オレンジ色が解き方の途中で求める角度（点線は補助線）</p>` : "";
  return `<h2>解き方</h2>${fig}<ol class="steps">${q.steps.map(s=>`<li>${s}</li>`).join("")}</ol>
          <div class="ans">答え：${q.fields.map(f=>f.label+" ＝ "+f.ans+f.unit).join("、")}</div>`;
}

$("check").onclick = ()=>{
  const q = QUESTIONS[state.cur];
  const results = q.fields.map((f,i)=> norm($("in"+i).value) === f.ans);
  const allOk = results.every(Boolean);
  state.marks[q.id] = allOk ? "○" : "✕";
  const detail = q.fields.map((f,i)=>
    `${f.label}：あなた ${$("in"+i).value||"（未入力）"}${$("in"+i).value?f.unit:""} → ${results[i]?"正解":"不正解"}`).join("<br>");
  $("result").className = "";
  $("result").innerHTML = `<div class="result"><div class="big ${allOk?"ok":"ng"}">${allOk?"○":"✕"}</div><div class="detail">${detail}</div></div>`;
  $("exp").innerHTML = allOk ? '<p class="hint">正解です！解き方を確認したいときは「解説だけ見る」を押してください。</p>' : explanation(q);
  renderList();
};

$("showExp").onclick = ()=>{ $("exp").innerHTML = explanation(QUESTIONS[state.cur]); };

// ===== カメラ + Teachable Machine 画像モデル =====
const IMG_MODEL = "https://teachablemachine.withgoogle.com/models/MCFYQpkbO/";
let imgModel = null, camStream = null;

async function startCam(deviceId){
  if(camStream) camStream.getTracks().forEach(t=>t.stop());
  camStream = await navigator.mediaDevices.getUserMedia({video: deviceId ? {deviceId:{exact:deviceId}} : true});
  $("cam").srcObject = camStream;
}
$("camBtn").onclick = async ()=>{
  const st = $("camStat");
  if(!navigator.mediaDevices || !window.isSecureContext){
    st.innerHTML = "このページはカメラを使えない開き方です（"+location.protocol+"）。https:// のURL（GitHub Pages）か、ローカルでは <b>起動.bat</b> から開いてください。";
    return;
  }
  try{
    st.textContent = "カメラを準備中…（許可を求められたら「許可」）";
    await startCam();                                   // ここで許可ポップアップが出る
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="videoinput");
    const cur = camStream.getVideoTracks()[0].getSettings().deviceId;
    $("camSel").innerHTML = devs.map((d,i)=>`<option value="${d.deviceId}" ${d.deviceId===cur?"selected":""}>${d.label||("カメラ"+(i+1))}</option>`).join("");
    $("camSel").classList.remove("hidden");
    $("cam").classList.remove("hidden"); $("pickBtn").classList.remove("hidden");
    $("camBtn").classList.add("hidden");
    st.textContent = "モデルを読み込み中…";
    if(typeof tmImage === "undefined") throw new Error("判定ライブラリを読み込めません（ネット接続を確認）");
    if(!imgModel) imgModel = await tmImage.load(IMG_MODEL+"model.json", IMG_MODEL+"metadata.json");
    st.textContent = "用紙をカメラに写して「選択」を押してください。";
  }catch(e){
    st.textContent = "カメラを開始できません："+(e.name||"")+" "+(e.message||e)+
      "（ブラウザのアドレスバー左の鍵/カメラ設定で、カメラを「許可」にしてください）";
  }
};
$("camSel").onchange = async e=>{ try{ await startCam(e.target.value); }catch(err){ $("camStat").textContent="切替失敗："+err.message; } };

// ===== パターン選択（画像表示）と回答欄への記入 =====
let curPattern = null;
const PATTERN_IMG = {"パターンA":"patternA.jpg","パターンB":"patternB.jpg","パターンC":"patternC.jpg"};
function showPattern(k){
  curPattern = k;
  const img = $("preview"); img.src = PATTERN_IMG[k]; img.classList.remove("hidden");
  document.querySelectorAll("#patSeg button[data-p]").forEach(b=>b.classList.toggle("on",b.dataset.p===k));
  $("patStat").textContent = k+" の画像を表示中。「回答欄へ記入」で回答を入力します。";
}
function fillAnswers(k){
  state.answers = JSON.parse(JSON.stringify(PATTERN_ANS[k]));
  state.marks = {};
  renderQuestion();
}
document.querySelectorAll("#patSeg button[data-p]").forEach(b=>b.onclick=()=>showPattern(b.dataset.p));
$("fillBtn").onclick = ()=>{
  if(!curPattern){ $("patStat").textContent = "先にパターンA・B・Cのいずれかを選んでください。"; return; }
  fillAnswers(curPattern);
  $("patStat").textContent = curPattern+" の回答を各問題に記入しました。";
};

$("pickBtn").onclick = async ()=>{
  const v = $("cam"), st = $("camStat");
  if(!imgModel){ st.textContent = "モデルを読み込み中です。少し待ってから押してください。"; return; }
  if(!v.videoWidth){ st.textContent = "カメラ映像がまだ準備できていません。"; return; }
  const cv = document.createElement("canvas"); cv.width = v.videoWidth; cv.height = v.videoHeight;
  cv.getContext("2d").drawImage(v,0,0);          // 押した瞬間のフレーム
  const pred = await imgModel.predict(cv);
  pred.sort((a,b)=>b.probability-a.probability);
  const top = pred[0], pct = Math.round(top.probability*100);
  const detail = pred.map(p=>p.className+" "+Math.round(p.probability*100)+"%").join(" / ");
  if(!PATTERN_ANS[top.className]){
    st.textContent = `判定：${top.className}（${pct}%）→ 回答は入力しません。 [${detail}]`;
    return;
  }
  showPattern(top.className);
  fillAnswers(top.className);
  st.textContent = `判定：${top.className}（${pct}%）→ 回答を各問題に入力しました。 [${detail}]`;
};

renderQuestion();
</script>
</body>
</html>
